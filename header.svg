<svg width="100%" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">

  <rect width="100%" height="100%" fill="#0d1117"/>

  <!-- Estrelas -->
  <g fill="white">
    <circle cx="100" cy="50" r="1"/>
    <circle cx="300" cy="80" r="1"/>
    <circle cx="700" cy="120" r="1"/>
    <circle cx="900" cy="60" r="1"/>
    <circle cx="500" cy="30" r="1"/>
    <circle cx="200" cy="200" r="1"/>
    <circle cx="800" cy="250" r="1"/>
    <circle cx="150" cy="320" r="1"/>
    <circle cx="850" cy="350" r="1"/>
  </g>

  <!-- Saturno -->
  <text x="50%" y="52%" text-anchor="middle"
        font-size="80" font-family="Segoe UI Emoji">
    🪐
  </text>

  <!-- Órbitas -->
  <circle cx="500" cy="200" r="110" stroke="#30363d" stroke-width="1" fill="none"/>
  <circle cx="500" cy="200" r="150" stroke="#30363d" stroke-width="1" fill="none"/>
  <circle cx="500" cy="200" r="190" stroke="#30363d" stroke-width="1" fill="none"/>
  <circle cx="500" cy="200" r="230" stroke="#30363d" stroke-width="1" fill="none"/>

  <!-- Linux -->
  <text fill="#f7df1e" font-size="14" font-family="Arial" font-weight="bold">
    <animateMotion dur="14s" repeatCount="indefinite"
      path="M500,200 m-110,0 a110,110 0 1,1 220,0 a110,110 0 1,1 -220,0"/>
    Linux
  </text>

  <!-- Docker -->
  <text fill="#2496ED" font-size="14" font-family="Arial" font-weight="bold">
    <animateMotion dur="18s" repeatCount="indefinite"
      path="M500,200 m-150,0 a150,150 0 1,1 300,0 a150,150 0 1,1 -300,0"/>
    AWS
  </text>

  <!-- Java -->
  <text fill="#f89820" font-size="14" font-family="Arial" font-weight="bold">
    <animateMotion dur="22s" repeatCount="indefinite"
      path="M500,200 m-190,0 a190,190 0 1,1 380,0 a190,190 0 1,1 -380,0"/>
    Java
  </text>

  <!-- Kubernetes -->
  <text fill="#326CE5" font-size="14" font-family="Arial" font-weight="bold">
    <animateMotion dur="26s" repeatCount="indefinite"
      path="M500,200 m-230,0 a230,230 0 1,1 460,0 a230,230 0 1,1 -460,0"/>
    Kubernetes
  </text>

</svg>
